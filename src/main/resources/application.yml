spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  jackson:
    serialization:
      INDENT_OUTPUT: true

  rabbitmq:
    addresses: ${CLOUDAMQP_URL}
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 3000ms
          max-attempts: 5

resend:
  api-key: ${RESEND_API_KEY}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
  packages-to-scan: com.reservations.booking.api.controller
  use-fqn: true